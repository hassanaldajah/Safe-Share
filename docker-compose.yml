version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: safeshare_db
    environment:
      POSTGRES_USER: safeshare_user
      POSTGRES_PASSWORD: safeshare_password
      POSTGRES_DB: safeshare_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safeshare_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/safeshare_db
      - SPRING_DATASOURCE_USERNAME=safeshare_user
      - SPRING_DATASOURCE_PASSWORD=safeshare_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - GCP_API_KEY=${GCP_API_KEY}
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
