# One command starts everything:  docker compose up --build
# First copy .env.example to .env and set JWT_SECRET (see README).
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-safeshare_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-safeshare_password}
      POSTGRES_DB: safeshare_db
    ports:
      - "127.0.0.1:5433:5432"   # reachable from this computer only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d safeshare_db"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/safeshare_db
      DB_USERNAME: ${DB_USERNAME:-safeshare_user}
      DB_PASSWORD: ${DB_PASSWORD:-safeshare_password}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy .env.example to .env)}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_WEBHOOK_URL: ${MAIL_WEBHOOK_URL:-}
      MAIL_WEBHOOK_SECRET: ${MAIL_WEBHOOK_SECRET:-}
      DEV_LOG_OTP: ${DEV_LOG_OTP:-false}
      GCP_API_KEY: ${GCP_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
    ports:
      - "127.0.0.1:8080:8080"   # direct API access from this computer only
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:80"     # the app: http://localhost:5173
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
