server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Encrypted uploads can be large
    client_max_body_size 60m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (do not append to) what the client sent, so the backend rate limit sees the real address
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (live notifications and chat) must not be buffered or cut off
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # React single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }
}
